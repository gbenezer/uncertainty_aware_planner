[project]
name = "uncertainty_aware_planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<=3.13"
dependencies = [
    "dash>=4.4.1",
    "datasets<5",
    "mapie>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pygrinder>=0.7",
    "pypots>=1.5",
    "pytorch-forecasting>=1.8.0",
    "pyyaml>=6.0",
    "torch>=2.8,<2.9.0",
    "transformers>=4.57",
    "tsdb>=0.8",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA wheels for Linux (Explorer) and Windows; macOS has no CUDA, so it uses the PyPI build.
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
# Tests import the package from src/ and the fixtures/ and tests/ helpers from the repo root.
pythonpath = ["src", "."]
testpaths = ["tests"]
