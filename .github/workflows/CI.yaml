name: CI

# Runs on every pull request and on pushes to main. Pair with branch protection
# (require this check to pass before merging) so failing code cannot reach main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # The [dev] extra includes ruff and pytest.
      - name: Install
        run: pip install -e ".[dev]"

      # CI only CHECKS formatting. It never rewrites code; run `ruff format .` locally to fix.
      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Tests
        run: pytest -q