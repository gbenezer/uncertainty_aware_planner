# DLinear forecasting baseline on censored demand: stockout hours keep their recorded sales ("no recovery"),
# which is what the dataset authors' censored baselines train on (paper Table 3: 31.56% WAPE). Project
# protocol: 6 rolling folds, then the final model forecasts the calibration and test weeks.
#   python -m uncertainty_aware_planner.pipeline.run --experiment configs/experiments/dlinear_baseline_censored.yaml
#   sbatch slurm/run_experiment.sbatch configs/experiments/dlinear_baseline_censored.yaml [--metrics-only]
name: dlinear_baseline_censored
data_config: configs/data.yaml

imputation:
  run_id: imp-none-censored
  # censored: built by the pipeline (pipeline.censored); imputed: data/processed/imputed_hourly/<run_id>.parquet
  # must already exist (written by pipeline/impute.py)
  source: censored

forecast:
  config: configs/forecasting_models/dlinear_forecasting_baseline.yaml
  seeds: [2025, 2026, 2027]
  folds: [1, 2, 3, 4, 5, 6]
  final_parts: [calib, test]
  # project | paper (paper: train through the calibration week, test only, *_paper_split folders, no folds)
  protocol: project

evaluate:
  # estimated_demand (for this point model it is its median, q500) or q500 (read from the run directory)
  point: estimated_demand
  truth: data/processed/demand_daily/imp-none-censored.parquet
  slices: data/processed/slices.parquet
  out: results/forecasting  # metrics in <out>/<imputation run id>/<protocol>/
