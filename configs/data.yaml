# Data-stage settings. README: "data.yaml records the download date and dataset version".

source:
  kind: hub  # "hub" loads from Hugging Face; "parquet" loads local files (fixtures)
  repo_id: Dingdong-Inc/FreshRetailNet-50K
  # Data files unchanged since the v1.0 commit (2025-05-07); later commits only edit README.md.
  # SHA-256 of both parquet files at this revision verified against the Hub on 2026-10-21.
  revision: c374e85975c82816c495acfa904cc55ab14a47d3
  card_version: "1.0 (05/08/2025)"
  license: CC BY 4.0
  downloaded_at: 2026-10-29  # first team download; the machine record is data/raw/DATA_VERSION.json

paths:
  cache_dir: data/hf_cache
  raw_dir: data/raw
  processed_dir: data/processed

splits_config: configs/splits.yaml

expected:
  n_series: 50000
  train_days: 90
  test_days: 7

cleaning:
  # EDA Q2: discount == 0 (16,039 train rows, 8 products) is a missing-value code, not 100% off.
  discount_missing_code: 0.0
  discount_fill: 1.0
  # EDA Q3: 34 rows above 1.0 (up to 1.088) are capped.
  discount_max: 1.0

imputation:
  # Feature order follows the dataset authors (latent_demand_recovery/exp/data/generate_data.py):
  # sales first, then these covariates, then hour of day. Covariates are divided by window max + 0.1.
  covariates: [discount, holiday_flag, precpt, avg_temperature]
  covariate_scale_offset: 0.1

forecasting:
  # Field roles follow the dataset authors' TFT config (demand_forecasting/TFT/configs/tft_config.py).
  target: demand_total
  group_ids: [store_id, product_id]
  static_categoricals:
    [city_id, store_id, management_group_id, first_category_id, second_category_id, third_category_id, product_id]
  time_varying_known_categoricals: [day_of_week, holiday_flag, activity_flag]
  time_varying_known_reals: [time_idx, discount, precpt, avg_temperature, avg_humidity, avg_wind_level]
  target_normalizer: null  # the authors use no target normalizer
